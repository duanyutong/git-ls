name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Cargo state
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component llvm-tools-preview --component rustfmt

      - name: Install validation tools
        uses: taiki-e/install-action@v2.87.24
        with:
          tool: |
            cargo-deny@0.20.2
            cargo-llvm-cov@0.9.1
            cargo-machete@0.9.2
            just@1.58.0
            prek@0.5.4
            typos-cli@1.50.3

      # The upstream 2.1.4 release asset reports 2.1.3; use the published crate.
      - name: Install cargo-sort from source
        run: cargo install cargo-sort --version 2.1.4 --locked

      - name: Check
        run: just check

      - name: Coverage
        run: just coverage

      - name: Verify pushed versions
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # The all-zero object ID asks xtask to verify from the latest reachable v* tag.
        run: cargo run --locked -p xtask -- version verify-range "0000000000000000000000000000000000000000" "${{ github.sha }}"
