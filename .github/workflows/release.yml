name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tag:
    name: Tag validated versions
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install compiler
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Configure tag identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify and publish annotated tags
        env:
          VALIDATED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          cargo build --locked -p xtask
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$VALIDATED_HEAD" refs/remotes/origin/main; then
            printf 'Validated revision %s is no longer in origin/main; refusing to publish tags.\n' "$VALIDATED_HEAD" >&2
            exit 1
          fi
          target/debug/xtask version tag-range 0000000000000000000000000000000000000000 "$VALIDATED_HEAD"
