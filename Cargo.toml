
[package]
name = "git-ls"
version = "0.16.4"
edition.workspace = true
rust-version.workspace = true
description = "Graphite-style stack lane renderer for local Git branch stacks"
license.workspace = true
repository = "https://github.com/duanyutong/git-ls"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["branchless", "cli", "git", "stack"]
publish = false
[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Explicit crate visibility prevents accidental public API expansion and satisfies unreachable_pub.
redundant_pub_crate = "allow"
nursery = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[dependencies]
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
gix = { version = "0.89.0", default-features = false, features = [
    "max-performance-safe",
    "revision",
    "sha1",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = [
    "build",
    "cargo",
    "rustc",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
