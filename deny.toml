[graph]
all-features = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
ignore = []

[licenses]
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  # gix-pack uses clru, which requires hashbrown 0.16; other dependencies use 0.17.
  { name = "hashbrown", version = "0.16.1" },
  # gix-macros and jiff-static require syn 2; other derive macros use syn 3.
  { name = "syn", version = "2.0.119" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
