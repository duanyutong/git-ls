[advisories]
ignore = []

[licenses]
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { name = "hashbrown", version = "0.16.1" },
    # gix-macros requires syn 2; the remaining derive macros use syn 3.
    { name = "syn", version = "2.0.119" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
