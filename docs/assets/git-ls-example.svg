<svg xmlns="http://www.w3.org/2000/svg" width="1263" height="580" viewBox="0 0 1263 580" role="img" aria-labelledby="title description">
  <title id="title">git ls — six example branch stacks with diff statistics</title>
  <desc id="description">Terminal output for the fictional acme/launchpad repository.
Six coloured stacks contain eleven branches covering billing, search, reports, imports, documentation and caching.
The upper group contains four stacks with three, two, one and one branches; the lower group contains two stacks with two branches each.
Eight branches contain one commit, two contain two commits and one contains three commits.
The payment-retries branch is checked out.
Each branch row includes its layer's added lines in green, deleted lines in red and abbreviated commit identifier.
Stack colours follow the built-in weighted assignment, whilst green main-history nodes connect the stacks across one collapsed history segment.
All names, commit subjects, hashes and line counts originate from a disposable synthetic repository.</desc>
