<svg xmlns="http://www.w3.org/2000/svg" width="1111" height="580" viewBox="0 0 1111 580" role="img" aria-labelledby="title description">
  <title id="title">git ls — six example branch stacks</title>
  <desc id="description">Terminal output for the fictional acme/launchpad repository. Six coloured stacks contain eleven branches covering billing, search, reports, imports, documentation, and caching. The upper group contains four stacks with three, two, one, and one branches respectively; the lower group contains two stacks with two branches each. Eight branches contain one commit, two contain two commits, and one contains three commits. The payment-retries branch is checked out. Green main-history nodes connect the stacks across one collapsed history segment. All names, commit subjects, and hashes originate from a synthetic demonstration repository.</desc>
