[project]
name = "git-ls-dev-tools"
version = "0.0.0"
requires-python = "==3.15.0"

[tool.uv]
package = false

[tool.pyright]
include = ["scripts"]
pythonVersion = "3.15"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = [".validation", ".codegraph", "target", "coverage"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
